name: Listnr
options:
  bundleIdPrefix: com.luisKisters
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    # Xcode 26 "Update to recommended settings" — set here so xcodegen emits them
    # and the modal never blocks the IDE (it also blocks the xcode MCP bridge).
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Listnr:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
      - path: Fixtures
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Listnr
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luisKisters.Listnr
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ListnrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
      # The indexer tests read a real m4b, so the fixtures ship in the test
      # bundle too — Bundle(for:) finds them without the host app.
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - target: Listnr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  ListnrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: Listnr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Listnr:
    build:
      targets:
        Listnr: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ListnrTests
        - ListnrUITests
